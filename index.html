<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

/* Background video total */
.bg{
    position:fixed;
    inset:0;
    overflow:hidden;
    z-index:1;
}

.bg video{
    width:100%;
    height:100%;
    object-fit:cover;
    filter:blur(30px) brightness(.4);
    transform:scale(1.2);
}

/* Video utama di tengah */
.main-video{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:2;
}

.main-video video{
    height:100vh;
    max-width:100%;
    object-fit:contain;
    filter: blur(5px) brightness(.85); /* 🔴 BLUR HALUS - VIDEO TETAP TERLIHAT JELAS */
}

/* Overlay kegelapan lembut */
.overlay{
    position:fixed;
    inset:0;
    background:radial-gradient(circle at center, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.75) 100%);
    z-index:3;
}

/* CONTAINER UTAMA TEPAT DI TENGAH (PREMIUM GLASS CARD) */
.content-wrapper{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    z-index:10;
}

.glass-card{
    background: rgba(18, 18, 24, 0.65);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 28px;
    padding: 35px 28px;
    width: 100%;
    max-width: 420px;
    text-align: center;
    color: white;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.15);
    animation: fadeIn 0.6s ease-out;
}

/* Status Indicator Live */
.status-badge{
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(37, 211, 102, 0.15);
    border: 1px solid rgba(37, 211, 102, 0.3);
    padding: 6px 14px;
    border-radius: 50px;
    font-size: 13px;
    font-weight: 600;
    color: #25D366;
    margin-bottom: 20px;
}

.dot-live{
    width: 8px;
    height: 8px;
    background-color: #25D366;
    border-radius: 50%;
    box-shadow: 0 0 10px #25D366;
    animation: pulse 1.5s infinite;
}

h1{
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 12px;
    letter-spacing: -0.5px;
    color: #ffffff;
}

p{
    font-size: 15px;
    opacity: 0.85;
    margin-bottom: 28px;
    line-height: 1.5;
    color: #e1e1e1;
    font-weight: 400;
}

/* Tombol CTA Pro Shimmer */
.btn{
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    text-decoration: none;
    background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
    color: #fff;
    padding: 18px 25px;
    border-radius: 50px;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.5px;
    transition: all 0.3s ease;
    cursor: pointer;
    border: none;
    width: 100%;
    box-shadow: 0 8px 25px rgba(37, 211, 102, 0.35);
    overflow: hidden;
}

.btn:hover{
    transform: translateY(-2px) scale(1.02);
    box-shadow: 0 12px 30px rgba(37, 211, 102, 0.5);
}

.btn:active{
    transform: translateY(0) scale(0.98);
}

@keyframes pulse {
    0% { transform: scale(0.95); opacity: 0.8; }
    50% { transform: scale(1.2); opacity: 1; }
    100% { transform: scale(0.95); opacity: 0.8; }
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
}

@media(max-width:480px){
    .glass-card{
        padding: 30px 22px;
        border-radius: 24px;
    }

    h1{
        font-size: 24px;
    }

    p{
        font-size: 14px;
    }

    .btn{
        padding: 16px 20px;
        font-size: 17px;
    }
}
</style>
